name: Export verified native parity blobs

on:
  push:
    branches:
      - ci-native-parity-proof-20260930

permissions:
  contents: write

concurrency:
  group: export-native-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Produce verified final files
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/apply-native-parity-source-fixes.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/android-ci.yml')
          text = p.read_text()
          block = '''      - name: Apply native parity source fixes\n        run: python3 .github/ci/apply-native-parity-source-fixes.py\n\n'''
          if text.count(block) != 1:
              raise SystemExit('expected exactly one temporary patch step')
          p.write_text(text.replace(block, '', 1))
          PY
          git diff --check -- \
            app/src/main/java/com/baystudio/droide/core/WorktreeManager.kt \
            app/src/main/java/com/baystudio/droide/core/GitManager.kt \
            .github/workflows/android-ci.yml

      - name: Store final files as Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          paths = [
              'app/src/main/java/com/baystudio/droide/core/WorktreeManager.kt',
              'app/src/main/java/com/baystudio/droide/core/GitManager.kt',
              '.github/workflows/android-ci.yml',
          ]
          for path in paths:
              data = open(path, 'rb').read()
              payload = json.dumps({
                  'content': base64.b64encode(data).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'Droide-native-parity-finalizer',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  result = json.load(response)
              print(f'FINAL_BLOB {path} {result["sha"]}')
          PY
