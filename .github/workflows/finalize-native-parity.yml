name: Persist verified native parity source

on:
  push:
    branches:
      - ci-native-parity-proof-20260930

permissions:
  contents: write

concurrency:
  group: persist-native-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Apply already-verified source transform
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/apply-native-parity-source-fixes.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/android-ci.yml')
          text = p.read_text()
          block = '''      - name: Apply native parity source fixes\n        run: python3 .github/ci/apply-native-parity-source-fixes.py\n\n'''
          if text.count(block) != 1:
              raise SystemExit('expected exactly one temporary patch step')
          p.write_text(text.replace(block, '', 1))
          PY
          rm .github/ci/apply-native-parity-source-fixes.py
          rm .github/workflows/finalize-native-parity.yml
          if grep -R "apply-native-parity-source-fixes" -n .github app/src; then
            echo "temporary patch reference still present" >&2
            exit 1
          fi
          git diff --check -- \
            app/src/main/java/com/baystudio/droide/core/WorktreeManager.kt \
            app/src/main/java/com/baystudio/droide/core/GitManager.kt \
            .github/workflows/android-ci.yml

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BayStudio CI"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/baystudio/droide/core/WorktreeManager.kt \
            app/src/main/java/com/baystudio/droide/core/GitManager.kt \
            .github/workflows/android-ci.yml
          git add -u -- \
            .github/ci/apply-native-parity-source-fixes.py \
            .github/workflows/finalize-native-parity.yml
          git diff --cached --check
          expected="$(printf '%s\n' \
            '.github/ci/apply-native-parity-source-fixes.py' \
            '.github/workflows/android-ci.yml' \
            '.github/workflows/finalize-native-parity.yml' \
            'app/src/main/java/com/baystudio/droide/core/GitManager.kt' \
            'app/src/main/java/com/baystudio/droide/core/WorktreeManager.kt' | sort)"
          actual="$(git diff --cached --name-only | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected staged paths:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          git status --short
          git commit -m "fix: fold native parity fixes into release source"
          git push origin HEAD:ci-native-parity-proof-20260930
